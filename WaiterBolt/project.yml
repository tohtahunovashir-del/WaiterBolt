name: WaiterBolt
options:
  bundleIdPrefix: com.waiterbolt
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
targets:
  WaiterBolt:
    type: application
    platform: iOS
    sources:
      - WaiterBoltApp.swift
      - Models
      - Services
      - ViewModels
      - Views
      - Components
      - Utilities
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waiterbolt.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
