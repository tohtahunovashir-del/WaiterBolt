name: WaiterBolt
options:
  bundleIdPrefix: com.waiterbolt
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.24.0"
targets:
  WaiterBolt:
    type: application
    platform: iOS
    sources:
      - WaiterBoltApp.swift
      - Models
      - Services
      - Repositories
      - ViewModels
      - Views
      - Components
      - Utilities
      - Assets.xcassets
      - LaunchScreen.storyboard
    info:
      path: Info.plist
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waiterbolt.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
